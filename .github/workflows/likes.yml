name: Update likes
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the votes
        run: |
          set -e
          RESP=$(curl -sS --fail --retry 3 --retry-delay 5 --max-time 20 -A "Mozilla/5.0" "https://games.roblox.com/v1/games/votes?universeIds=9890904027")
          UP=$(echo "$RESP" | jq -r '.data[0].upVotes')
          DOWN=$(echo "$RESP" | jq -r '.data[0].downVotes')
          if ! [[ "$UP" =~ ^[0-9]+$ ]]; then echo "Unexpected answer: $RESP"; exit 1; fi
          echo "{\"upVotes\": $UP, \"downVotes\": $DOWN}" > likes.json
          cat likes.json
      - name: Save it
        run: |
          git config user.name "likes-bot"
          git config user.email "likes-bot@users.noreply.github.com"
          git add likes.json
          git diff --cached --quiet || (git commit -m "update likes" && git push)
